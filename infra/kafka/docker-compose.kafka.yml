# Pedidos360 | Arquitectura Kafka: 3 nodos ZooKeeper + 3 brokers (Confluent Platform 7.9 = Apache Kafka 3.9).
# Kafka 4.x elimino ZooKeeper; por eso se usa la ultima linea que aun lo incluye.
# Todo corre en un mismo PC: sirve para demostrar replicacion y caida de un broker,
# no protege ante la falla del computador completo. PLAINTEXT solo para uso local.
name: pedidos360-kafka

x-zookeeper-comun: &zookeeper-comun
  image: confluentinc/cp-zookeeper:7.9.1
  restart: unless-stopped
  networks:
    - kafka-net

x-zookeeper-env: &zookeeper-env
  ZOOKEEPER_CLIENT_PORT: "2181"
  ZOOKEEPER_TICK_TIME: "2000"
  ZOOKEEPER_INIT_LIMIT: "5"
  ZOOKEEPER_SYNC_LIMIT: "2"
  ZOOKEEPER_SERVERS: "zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888"
  KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
  KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=srvr,ruok"

x-kafka-comun: &kafka-comun
  image: confluentinc/cp-kafka:7.9.1
  restart: unless-stopped
  depends_on:
    - zookeeper-1
    - zookeeper-2
    - zookeeper-3
  networks:
    - kafka-net
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "kafka-broker-api-versions --bootstrap-server localhost:19092 >/dev/null 2>&1",
      ]
    interval: 10s
    timeout: 8s
    retries: 18
    start_period: 40s

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: "zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181"
  KAFKA_LISTENERS: "INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
  KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
  KAFKA_MIN_INSYNC_REPLICAS: "2"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

services:
  zookeeper-1:
    <<: *zookeeper-comun
    hostname: zookeeper-1
    container_name: pedidos360-zk1
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: "1"
    volumes:
      - zk1_data:/var/lib/zookeeper/data
      - zk1_log:/var/lib/zookeeper/log

  zookeeper-2:
    <<: *zookeeper-comun
    hostname: zookeeper-2
    container_name: pedidos360-zk2
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: "2"
    volumes:
      - zk2_data:/var/lib/zookeeper/data
      - zk2_log:/var/lib/zookeeper/log

  zookeeper-3:
    <<: *zookeeper-comun
    hostname: zookeeper-3
    container_name: pedidos360-zk3
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: "3"
    volumes:
      - zk3_data:/var/lib/zookeeper/data
      - zk3_log:/var/lib/zookeeper/log

  kafka-1:
    <<: *kafka-comun
    hostname: kafka-1
    container_name: pedidos360-kafka1
    ports:
      - "127.0.0.1:29092:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:19092,EXTERNAL://localhost:29092"
    volumes:
      - kafka1_data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-comun
    hostname: kafka-2
    container_name: pedidos360-kafka2
    ports:
      - "127.0.0.1:39092:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-2:19092,EXTERNAL://localhost:39092"
    volumes:
      - kafka2_data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-comun
    hostname: kafka-3
    container_name: pedidos360-kafka3
    ports:
      - "127.0.0.1:49092:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-3:19092,EXTERNAL://localhost:49092"
    volumes:
      - kafka3_data:/var/lib/kafka/data

networks:
  kafka-net:
    name: pedidos360-kafka-net
    driver: bridge

volumes:
  zk1_data:
  zk1_log:
  zk2_data:
  zk2_log:
  zk3_data:
  zk3_log:
  kafka1_data:
  kafka2_data:
  kafka3_data:
