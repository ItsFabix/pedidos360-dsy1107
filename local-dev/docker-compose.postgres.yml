services:
  postgres:
    image: postgres:18-alpine
    container_name: dsy1107-postgres-local
    environment:
      POSTGRES_DB: pedidosdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dsy1107-local
    ports:
      - "5432:5432"
    volumes:
      - dsy1107_pgdata:/var/lib/postgresql

volumes:
  dsy1107_pgdata:
