spring.application.name=ms-auditoria
server.port=8084
# Solo accesible desde tu PC: este endpoint aun no tiene autenticacion.
server.address=127.0.0.1

# ===========================
# Kafka (consumidor)
# ===========================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:39092,localhost:49092}
spring.kafka.consumer.group-id=pedidos360-auditoria
# Un grupo nuevo empieza desde el principio del topico.
spring.kafka.consumer.auto-offset-reset=earliest
# El offset se confirma desde Spring despues de procesar cada registro (no en automatico).
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
# 3 hilos: uno por particion del topico.
spring.kafka.listener.concurrency=3

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer envuelve al JSON: un mensaje corrupto no deja trabado al consumidor.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=cl.duoc.dsy1107.auditoria.modelo.PedidoEvento
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=cl.duoc.dsy1107.auditoria.modelo