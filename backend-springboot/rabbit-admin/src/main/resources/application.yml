server:
  port: 8082

spring:
  application:
    name: rabbit-admin

  rabbitmq:
    addresses: ${RABBIT_ADDRESSES:localhost:5672,localhost:5673}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/84e517e6-6e52-43b3-82da-162220153ea3/v2.0
          audiences:
            - d7a99a6a-b387-494e-a239-5ea101bb3856

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
