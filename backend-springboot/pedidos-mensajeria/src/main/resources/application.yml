server:
  port: 8081

spring:
  application:
    name: pedidos-mensajeria

  rabbitmq:
    # Lista de nodos del clúster: si uno no responde, el cliente prueba el siguiente.
    addresses: ${RABBIT_ADDRESSES:localhost:5672,localhost:5673}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}
    listener:
      simple:
        # ACK manual: el consumidor confirma explícitamente cuando terminó bien.
        acknowledge-mode: manual
        # Un mensaje a la vez por consumidor: el reintento es predecible.
        prefetch: 1
        # Un mensaje rechazado no vuelve solo a la cola: decidimos nosotros (reintento o DLQ).
        default-requeue-rejected: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/84e517e6-6e52-43b3-82da-162220153ea3/v2.0
          audiences:
            - d7a99a6a-b387-494e-a239-5ea101bb3856

management:
  endpoints:
    web:
      exposure:
        include: health

pedidos360:
  mensajeria:
    reintentos-max: 2
    retry-ttl-ms: 5000
    dominios-con-fallo: ${SIMULAR_FALLO_DOMINIOS:}