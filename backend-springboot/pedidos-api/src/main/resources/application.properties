server.port=8080

# ===========================
# PostgreSQL / Amazon RDS
# ===========================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:pedidosdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===========================
# Microsoft Entra ID / JWT
# ===========================
# Directory (tenant) ID. No usar el Client ID aquí.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/84e517e6-6e52-43b3-82da-162220153ea3/v2.0

# Application (client) ID de la App Registration de la API.
spring.security.oauth2.resourceserver.jwt.audiences[0]=d7a99a6a-b387-494e-a239-5ea101bb3856

# ===========================
# Aplicación
# ===========================
spring.application.name=pedidos-api

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


# ===========================
# RabbitMQ (productor de eventos)
# ===========================
spring.rabbitmq.addresses=${RABBIT_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
# Poner en false para trabajar sin RabbitMQ.
pedidos360.mensajeria.habilitado=true

# ===========================
# Kafka (productor de eventos)
# ===========================
# Solo publica si KAFKA_HABILITADO=true; en la EC2 queda apagado porque ahi no hay Kafka.
pedidos360.kafka.habilitado=${KAFKA_HABILITADO:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:39092,localhost:49092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# acks=all + min.insync.replicas=2 del topico: el evento se confirma cuando esta en al menos 2 brokers.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# JSON limpio, sin el nombre de la clase Java en los headers: asi cualquier consumidor puede leerlo.
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Si Kafka no responde, no dejar colgada la peticion HTTP del usuario.
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000