server:
  port: 8083

spring:
  application:
    name: kafka-admin

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/84e517e6-6e52-43b3-82da-162220153ea3/v2.0
          audiences:
            - d7a99a6a-b387-494e-a239-5ea101bb3856

kafka:
  admin:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:39092,localhost:49092}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
